[package]
name = "thermopsis-agent"
version = "0.1.0"
edition = "2021"
description = "Thermopsis desktop agent: temperatures, power, disk health and tests of this computer, reported to a BitBOINC account"
license-file = "../LICENSE"
publish = false

[features]
gui = ["dep:eframe"]

[[bin]]
name = "thermopsis"
path = "src/bin/thermopsis.rs"
required-features = ["gui"]

[dependencies]
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
sysinfo = "0.33"
getrandom = "0.2"
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
[workspace]
